kind = "web"
previewPath = "/"
title = "Affinity Risk Solutions for AAA Clubs"
version = "1.0.0"
id = "artifacts/affinity-risk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24810

[services.development]
run = "pnpm --filter @workspace/affinity-risk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/affinity-risk", "run", "build" ]
publicDir = "artifacts/affinity-risk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24810"
BASE_PATH = "/"
